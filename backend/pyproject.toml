[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agentpay-backend"
version = "0.1.0"
description = "Backend foundation for AgentPay AI-Native Commerce Agent"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "sqlalchemy>=2.0.43,<3.0.0",
  "alembic>=1.16.0,<2.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "langgraph>=0.6.0,<1.0.0",
  "langchain-core>=0.3.0,<1.0.0",
  "groq>=1.6.0,<2.0.0",
  "psutil>=7.0.0,<8.0.0",
  "razorpay>=1.4.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "httpx>=0.28.0,<1.0.0",
  "ruff>=0.12.0,<1.0.0"
]

[tool.pytest.ini_options]
markers = [
  "live_groq: tests that make real external API calls to Groq"
]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]